# The golden set.
#
# Every question here was filed by a real person on vLLM's issue tracker.
# Nothing is synthesised. A model-generated set is written in the vocabulary of
# the documentation it was generated from, so it flatters retrieval and measures
# the wrong thing; real issues carry the vocabulary gap between how users ask
# and how docs are written, which is the failure this system has to survive.
#
# Provenance: harvested with `anchor golden harvest` from issues labelled
# `usage` and `documentation`, sorted by reaction count, then curated against
# retrieval evidence (`anchor golden propose`). 563 candidates harvested,
# reviewed on evidence, and narrowed to the entries below.
#
# Curation rules, applied to every entry:
#   * source_url is required and points at the issue it came from. An entry that
#     cannot be traced back to a real question cannot be defended.
#   * expected_source_paths must exist in the ingested corpus and must actually
#     contain the answer. Each was checked by hand against the checkout.
#   * Questions retrieval currently FAILS are deliberately kept. A set built only
#     from what the system already finds is a transcript of current behaviour and
#     cannot measure anything. See vllm-6660-disable-logging.
#   * Questions no documentation can answer are dropped, not marked hard. Issue
#     9750 ("Can I get the loss of model directly?") and 13609 (sparse
#     embeddings) were rejected on that basis.
#   * expected_answer is written from the documentation. Where it is blank it has
#     not been transcribed from the source yet; it is never filled from a model's
#     output.
#
# expected_chunk_ids is intentionally absent: chunk ids are stable only within
# one (strategy, commit) pair, so they are resolved from the paths at eval time.
#
# STATUS: 21 of a target 60-80. This is a first curated batch, not the finished
# set. The remaining candidates are in candidates.jsonl awaiting review.

queries:
  - id: vllm-4449-enforce-eager
    question: what is enforce_eager
    source_url: https://github.com/vllm-project/vllm/issues/4449
    category: config
    difficulty: easy
    expected_source_paths:
      - vllm/config/model.py
      - docs/design/debug_vllm_compile.md
    expected_answer: >-
      enforce_eager controls whether vLLM always uses eager mode PyTorch.
      Passing --enforce-eager turns off the vLLM-torch.compile integration and
      runs entirely in eager mode, which also turns off CUDA graphs.
    notes: >-
      Retrieval ranks the correct span third; the top two hits are unrelated
      pages that merely discuss eager execution.

  - id: vllm-6641-max-num-seqs-and-max-model-len
    question: What do max_num_seqs and max_model_len do
    source_url: https://github.com/vllm-project/vllm/issues/6641
    category: config
    difficulty: easy
    expected_source_paths:
      - docs/configuration/conserving_memory.md
      - vllm/config/model.py
    expected_answer: >-
      max_model_len limits the context length of the model and max_num_seqs
      limits the maximum batch size. Both reduce memory usage.


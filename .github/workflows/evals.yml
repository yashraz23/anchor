name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ANCHOR_PG_DSN: postgresql://anchor:anchor@localhost:5432/anchor
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anchor -d anchor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.11
      - run: uv sync --frozen --all-extras

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy src tests

      - name: schema applies
        run: uv run anchor db init

      - name: pytest
        run: uv run pytest --cov=anchor --cov-report=term-missing

  # The evals. The spec says these must run in CI, and they do, on every push.
  #
  # They run over the fixture corpus in tests/fixtures/corpus rather than the
  # real one. Building the real corpus means cloning vLLM and embedding 12,600
  # chunks, which is around fifteen minutes per run; the fixture exercises every
  # stage of the same pipeline in seconds. What this proves is that ingest,
  # chunking, indexing, retrieval, the oracle and the recall harness all still
  # work end to end. What it cannot prove is that recall on the real corpus has
  # not moved, which is what `anchor eval-retrieval` on a developer machine is
  # for. That is a real limitation and it is the honest trade for having evals
  # in CI at all rather than nowhere.
  evals:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anchor -d anchor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ANCHOR_INGEST__LOCAL_SOURCE: tests/fixtures/corpus
      ANCHOR_EVALUATE__GOLDEN_PATH: data/golden/fixture.yaml

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.11
      - run: uv sync --frozen --all-extras

      # The encoder and cross-encoder are ~500MB together and do not change
      # between runs, so they are cached rather than re-downloaded every push.
      - name: cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('pyproject.toml') }}

      - name: the golden set is valid
        run: |
          uv run anchor db init
          ANCHOR_EVALUATE__GOLDEN_PATH=data/golden/golden.yaml \
            uv run python -c "
          from pathlib import Path
          from anchor.evaluate.golden import load_golden
          queries = load_golden(Path('data/golden/golden.yaml'))
          print(f'{len(queries)} golden queries parse and validate')
          assert queries, 'the golden set is empty'
          "

      - name: build the corpus
        run: |
          uv run anchor ingest
          uv run anchor chunk
          uv run anchor index

      - name: the symbol oracle builds
        run: uv run anchor oracle-build

      - name: every expected document exists
        run: |
          uv run anchor golden sync
          uv run anchor golden validate

      - name: recall has not regressed
        # A floor, not a target. It fails the build if a change breaks
        # retrieval, rather than letting it ship and be noticed later.
        run: uv run anchor eval-retrieval --min-recall 0.9

      - name: code-block integrity has not regressed
        run: |
          uv run python -c "
          from anchor.config import ChunkStrategy, get_settings
          from anchor.evaluate.integrity_run import measure_integrity
          results = {r.strategy: r for r in measure_integrity(get_settings())}
          aware = results[ChunkStrategy.STRUCTURE_AWARE.value]
          print(f'structure_aware: {aware.intact}/{aware.code_blocks} blocks intact')
          assert aware.rate == 1.0, (
              'structure-aware chunking must never split a fenced code block; '
              f'got {aware.rate:.2%}'
          )
          "

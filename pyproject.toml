[project]
name = "anchor"
version = "0.1.0"
description = "Grounding-verified RAG over vLLM / LLM-serving documentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Yash Gudivada" }]

dependencies = [
    # datastore
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    # config
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # retrieval models (bge-small embedder + bge-reranker-base cross-encoder)
    "sentence-transformers>=3.2",
    "torch>=2.4",
    # generation
    "anthropic>=0.40",
    "httpx>=0.27",
    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # ingest
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    # cli
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
eval = [
    # ragas is deliberately absent. Every published version through 0.4.3
    # hard-requires langchain, langchain-community, langchain-openai and
    # openai, and this project's stated constraint is that LangChain does not
    # enter the tree. The triad is implemented in anchor/evaluate/triad.py.
    "wandb>=0.18",
    "langfuse>=2.53",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
demo = ["gradio>=5.0"]

[project.scripts]
anchor = "anchor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anchor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]  # formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "pgvector.*", "ragas.*", "wandb.*", "langfuse.*", "gradio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: requires a live Postgres with pgvector",
    "slow: downloads models or hits the network",
]
